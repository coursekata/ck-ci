name: ci

# This repository's own gate. quality runs the general bar on this repository. tf-quality runs the
# OpenTofu bar against its fixture in tf-quality/tests/fixture, so a change to either workflow runs
# here before any caller can pin it, at the cost of a second secret and CVE scan. hooks runs this
# repository's pre-commit hooks, and image the image actions' scripts against real tools, then the
# actions themselves on the fixture. crane-arm64 installs crane on arm64.
# ci-passed is the single stable status check the main branch ruleset points at.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  tf-quality:
    uses: ./.github/workflows/tf-quality.yml
    with:
      tofu_version: "1.12.2"

  # The hooks, apart from gitleaks, whose full-history scan quality runs. OpenTofu and bats are here
  # for the test hooks.
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.12.2"
          tofu_wrapper: false

      # The bats versions both jobs pin. Nothing moves them, so a change by hand changes both.
      - id: bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          bats-version: 1.14.0
          support-version: 0.3.0
          assert-version: 2.2.4
          detik-install: false
          file-install: false

      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        env:
          SKIP: gitleaks-system
          BATS_LIB_PATH: ${{ steps.bats.outputs.lib-path }}
        with:
          extra-args: --all-files

  image:
    # The image actions' scripts against a real BuildKit, Docker, crane and registry, with
    # buildx and the builder set up the way build-action sets them up. Their unit tests run
    # in hooks.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      registry:
        image: registry:3.1.2@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The buildx version and BuildKit image build-action pins. Renovate moves every copy in
      # one pull request; a change by hand changes them all.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.0
          driver: docker-container
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
          cache-binary: false

      - name: Install crane, as the actions do
        run: image/lib/install-crane.sh

      # The bats versions both jobs pin. Nothing moves them, so a change by hand changes both.
      - id: bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          bats-version: 1.14.0
          support-version: 0.3.0
          assert-version: 2.2.4
          detik-install: false
          file-install: false

      - name: Run the image actions' scripts against real tools
        env:
          BATS_LIB_PATH: ${{ steps.bats.outputs.lib-path }}
        run: bats image/tests/integration

      # The actions themselves, on the fixture, so a template or an output that only a live run
      # evaluates fails here before any caller pins a release. bake resolves a bake file's paths
      # against the working directory, which a composite step cannot change, so the fixture is
      # copied to the workspace root first. No cache repository, so the build starts cold.
      # release-action reads this run's ref from GitHub to check it is the head: on a pull request,
      # its merge ref.
      - name: Put the fixture where the actions run
        run: cp -R image/tests/fixture/. .

      - id: build
        uses: ./image/build-action
        with:
          target: app
          test-target: app-test

      - uses: ./image/check-health-action
        with:
          image: ${{ steps.build.outputs.image }}

      - id: push
        uses: ./image/push-action
        with:
          candidate-repository: localhost:5000/candidate/app
          layout: ${{ steps.build.outputs.layout }}
          digest: ${{ steps.build.outputs.digest }}
          cache-layout: ${{ steps.build.outputs.cache-layout }}
          cache-digest: ${{ steps.build.outputs.cache-digest }}

      - id: release
        uses: ./image/release-action
        with:
          candidate-repository: localhost:5000/candidate/app
          release-repository: localhost:5000/release/app
          cache-repository: localhost:5000/cache/app
          digest: ${{ steps.push.outputs.digest }}
          cache-digest: ${{ steps.push.outputs.cache-digest }}
          tags: ${{ steps.build.outputs.tags }}

      # A release cut short after its commit tag, before its run tag: the head's next run finishes it.
      - name: Cut a release short
        env:
          IMAGE: localhost:5000/candidate/app@${{ steps.push.outputs.digest }}
        run: crane copy "$IMAGE" "localhost:5000/release/cut:sha-$GITHUB_SHA"

      - id: finish
        uses: ./image/release-action
        with:
          candidate-repository: localhost:5000/candidate/app
          release-repository: localhost:5000/release/cut
          digest: ${{ steps.push.outputs.digest }}
          tags: ${{ steps.build.outputs.tags }}

      # A merge to main while this runs moves the head on, a pull request's merge ref with it, and
      # each release then rightly writes nothing. A head read after both releases that is still this
      # commit was the head throughout, since a head that moved on never comes back, so both must
      # have released.
      - name: Each release named the build, or wrote nothing once the head moved on
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          BUILT: ${{ steps.build.outputs.digest }}
          RELEASED: ${{ steps.release.outputs.digest }}
          FLAG: ${{ steps.release.outputs.released }}
          FINISHED: ${{ steps.finish.outputs.digest }}
          FINISH_FLAG: ${{ steps.finish.outputs.released }}
          BUILD_TAGS: ${{ steps.build.outputs.tags }}
        run: |
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader
          GIT_CONFIG_VALUE_0="Authorization: Basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_VALUE_0
          head=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" | awk -v r="$GITHUB_REF" '$2 == r { print $1 }')
          [ -n "$head" ] || { echo "::error::Could not read $GITHUB_REF's head."; exit 1; }
          lines() { jq -Rsc 'split("\n") | map(select(. != "")) | sort'; }
          tags() { image/lib/read-registry.sh ls "$1" | lines; }
          # expect <step> <digest> <flag> <tags now> <tags released> <tags before>
          expect() {
            if [ -n "$BUILT" ] && [ "$2" = "$BUILT" ] && [ "$3" = true ] && [ "$4" = "$5" ]; then return; fi
            if [ "$head" != "$GITHUB_SHA" ] && [ -z "$2" ] && [ "$3" = false ] && [ "$4" = "$6" ]; then
              echo "::notice::The head moved on to $head, so $1 rightly released nothing."
              return
            fi
            echo "::error::$1: built=$BUILT released=$2 released-flag=$3 tags=$4 head=$head"
            return 1
          }
          expect release "$RELEASED" "$FLAG" "$(tags localhost:5000/release/app)" "$(printf '%s\nlatest\n' "$BUILD_TAGS" | lines)" '[]'
          expect finish "$FINISHED" "$FINISH_FLAG" "$(tags localhost:5000/release/cut)" \
            "$(printf 'sha-%s\nrun-%s\nlatest\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" | lines)" "$(echo "sha-$GITHUB_SHA" | lines)"

  # The image job installs crane on x86_64; callers build on arm64 too, so its pinned checksum is
  # checked here.
  crane-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install crane, as the actions do
        run: image/lib/install-crane.sh

      - run: crane version

  ci-passed:
    if: always()
    needs: [quality, tf-quality, hooks, image, crane-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Assert all required CI jobs succeeded
        run: |
          for r in "${{ needs.quality.result }}" "${{ needs.tf-quality.result }}" "${{ needs.hooks.result }}" "${{ needs.image.result }}" "${{ needs.crane-arm64.result }}"; do
            if [ "$r" != "success" ]; then
              echo "quality: ${{ needs.quality.result }}, tf-quality: ${{ needs.tf-quality.result }}, hooks: ${{ needs.hooks.result }}, image: ${{ needs.image.result }}, crane-arm64: ${{ needs.crane-arm64.result }}"
              exit 1
            fi
          done
          echo "All required CI jobs succeeded."
