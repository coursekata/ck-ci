name: tf-quality

# The quality bar for the org's OpenTofu repositories. A caller adds one job that `uses:` this
# workflow, and it runs the general bar in quality.yml as well, so an OpenTofu repository makes one
# call and cannot take half the bar. The checks are tf-quality/pre-commit-config.yaml, run here at
# this workflow's own commit over every tracked file, whatever the caller's own hooks say: a caller's
# .tflint.hcl and .trivyignore set how strict a tool is, not whether it runs. A reusable-workflow call
# succeeds only if every job in it succeeds, so a caller's ci-passed picks up a check added here
# without touching its branch ruleset.
#
# Credential-free: validate and test init with -backend=false, tofu test drives the suites' mock
# providers, and trivy fetches only its public checks. Actions are pinned to full commit SHAs, which
# Dependabot keeps current; tflint and trivy are pinned here, and Renovate keeps them current.

on:
  workflow_call:
    inputs:
      tofu_version:
        description: "OpenTofu version to install (match the caller's .opentofu-version)."
        type: string
        default: "1.12.2" # bump manually (not a Dependabot-tracked ecosystem)

permissions:
  contents: read

jobs:
  tofu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ inputs.tofu_version }}
          tofu_wrapper: false

      - name: Install tflint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - name: Install trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.0

      # One provider cache for every directory's init, so a provider many directories use is
      # downloaded and unpacked once rather than once per directory on the runner's disk.
      - name: Share one provider cache across directories
        run: |
          mkdir -p "$RUNNER_TEMP/tofu-plugins"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/tofu-plugins" >> "$GITHUB_ENV"

      # The bar and its own hooks both come from this workflow's commit, so a caller pinned to a
      # release runs that release's checks, and a pull request here runs its own.
      - name: Read the bar at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .tf-quality-bar
          sparse-checkout: tf-quality/pre-commit-config.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Run the bar's own hooks at that commit too
        env:
          REPOSITORY: ${{ job.workflow_repository }}
          BAR: .tf-quality-bar
        run: |
          SHA=$(git -C "$BAR" rev-parse HEAD)
          cp "$BAR/tf-quality/pre-commit-config.yaml" "$RUNNER_TEMP/tf-quality.yaml"
          URL="https://github.com/$REPOSITORY" SHA="$SHA" yq -i \
            '(.repos[] | select(.repo == "https://github.com/coursekata/ck-ci")) |= (.repo = env(URL) | .rev = env(SHA))' \
            "$RUNNER_TEMP/tf-quality.yaml"
          # Both of the bar's ck-ci entries, or it would run its hooks from the release it names.
          [ "$(SHA="$SHA" yq '[.repos[] | select(.rev == env(SHA))] | length' "$RUNNER_TEMP/tf-quality.yaml")" = 2 ] \
            || { echo "::error::The bar does not name ck-ci twice, so its hooks cannot run at this commit."; exit 1; }

      # tflint fetches its plugins from the GitHub API, where an anonymous client gets 60 requests an
      # hour shared across the runner's IP, so it uses the ambient run token. No cache: the bar's
      # tools come fresh from their pinned revs on every run.
      - uses: j178/prek-action@af4d4fcb6922b8e6f65c0426947125fcc38794ce # v3.0.2
        env:
          SKIP: gitleaks-system
          GITHUB_TOKEN: ${{ github.token }}
        with:
          cache: false
          extra-args: --config ${{ runner.temp }}/tf-quality.yaml --stage pre-push --all-files

  # The general bar: the full-history secret scan and the CVE scan.
  scan:
    uses: ./.github/workflows/quality.yml
