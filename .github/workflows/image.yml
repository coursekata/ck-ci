name: image

# Builds and tests a repository's images on its pull requests, pushing nothing. On a
# push to its default branch it builds them again, pushes each by digest, tests that
# digest, and releases exactly the tested digests. Run by hand on the default branch,
# it builds without the release cache, tests as a push does, and makes its cache the
# release cache; it releases only a commit with no release yet. A repository calls
# this from a workflow with one job, pinned by a release tag of this repository; the
# image pipeline docs here describe the contract.
#
# Each job runs on a fresh GitHub-hosted runner. The build job starts its own
# BuildKit builder, so no build state outlives it; the release job only copies, with
# buildx and no builder. No job can read or write the GitHub Actions cache. Project
# code runs only in containers that hold none of the job's credentials, files or
# outputs: BuildKit's, and the health run's.

on:
  workflow_call:
    inputs:
      targets:
        description: JSON array of the images to build, each with its test target, the stage the test replaces, and its candidate, release and cache repositories, and optionally healthcheck set to false to skip its health run.
        type: string
        required: true
      bake-file:
        description: Bake file, relative to the repository root.
        type: string
        default: docker-bake.hcl
      aws-region:
        description: Region of the three roles.
        type: string
        required: true
      candidate-role-arn:
        description: Role a default-branch build assumes to push candidates and read the release cache.
        type: string
        required: true
      cache-read-role-arn:
        description: Role a pull request assumes to read the release cache.
        type: string
        required: true
      release-role-arn:
        description: Role the release job assumes in the release environment.
        type: string
        required: true
      runner:
        description: GitHub-hosted runner label. ubuntu-24.04-arm builds arm64 images natively.
        type: string
        default: ubuntu-24.04
      build-secret-env:
        description: Environment variable the bake file reads the build secret from, as in secret = ["id=<id>,env=<name>"]. Leave empty when no build reads a secret.
        type: string
        default: ""
    secrets:
      build-secret:
        description: One read-only credential the builds may read, such as a package registry token. It reaches the project's code and its third-party install scripts inside BuildKit, on pull requests too.
        required: false
    outputs:
      digests:
        description: JSON object mapping each target to the digest released for this commit. Empty on a pull request.
        value: ${{ jobs.release.outputs.digests }}

permissions: {}

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    cache-mode: none
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    outputs:
      build: ${{ steps.test.outputs.build }}
    steps:
      - name: Require a GitHub-hosted runner and this workflow's own commit
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::The image pipeline runs only on GitHub-hosted runners, so no build state outlives a job."; exit 1; }
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::job.workflow_sha is '$WORKFLOW_SHA'; the pipeline scripts are checked out at it."; exit 1; }
          echo "PIPELINE=$GITHUB_WORKSPACE/pipeline/image-pipeline" >> "$GITHUB_ENV"
          echo "WORK=$RUNNER_TEMP/image-pipeline" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/image-pipeline"

      - name: Require a pull request, or a push or a run by hand on the default branch
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$EVENT" in
            pull_request) mode=pr fresh=false ;;
            push | workflow_dispatch)
              if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
                echo "::error::This run is on $GITHUB_REF. Images are released only from the default branch, $DEFAULT_BRANCH."
                exit 1
              fi
              mode=push fresh=false
              if [ "$EVENT" = workflow_dispatch ]; then fresh=true; fi
              ;;
            *)
              echo "::error::The image pipeline runs on pull_request, and on push or workflow_dispatch on the default branch, not on $EVENT."
              exit 1
              ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "fresh=$fresh" >> "$GITHUB_OUTPUT"

      - name: Check out the commit under build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false

      - name: Check out the pipeline scripts at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: coursekata/ck-tf-modules
          ref: ${{ job.workflow_sha }}
          path: pipeline
          sparse-checkout: image-pipeline
          persist-credentials: false

      - name: Read the tool pins
        id: pins
        run: |
          . "$PIPELINE/pins.sh"
          echo "buildkit=$BUILDKIT_IMAGE" >> "$GITHUB_OUTPUT"
          echo "buildx=$BUILDX_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up buildx and this job's builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ steps.pins.outputs.buildx }}
          driver: docker-container
          driver-opts: image=${{ steps.pins.outputs.buildkit }}
          cache-binary: false

      - name: Resolve and check the targets
        working-directory: src
        env:
          TARGETS: ${{ inputs.targets }}
          BAKE_FILE: ${{ inputs.bake-file }}
        run: |
          "$PIPELINE/targets.sh" "$TARGETS" > "$WORK/targets.json"
          "$PIPELINE/resolve.sh" "$BAKE_FILE" "$WORK/targets.json" > "$WORK/resolved.json"

      # A default-branch build pushes candidates. A pull request only reads the release
      # cache, and a fork's pull request, which gets no OIDC token, builds without it.
      - name: Choose this run's role
        id: role
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          CANDIDATE_ROLE: ${{ inputs.candidate-role-arn }}
          CACHE_READ_ROLE: ${{ inputs.cache-read-role-arn }}
        run: |
          if [ "$MODE" = push ]; then
            arn=$CANDIDATE_ROLE
          elif [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            arn=$CACHE_READ_ROLE
          else
            arn=
          fi
          echo "arn=$arn" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        if: steps.role.outputs.arn != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Log in to the registries
        if: steps.role.outputs.arn != ''
        run: |
          "$PIPELINE/registry-login.sh" "$WORK/targets.json"

      - name: Build
        id: build
        working-directory: src
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          IMPORT: ${{ steps.role.outputs.arn != '' && steps.mode.outputs.fresh != 'true' }}
          BUILD_SECRET: ${{ secrets.build-secret }}
          BUILD_SECRET_ENV: ${{ inputs.build-secret-env }}
        run: |
          "$PIPELINE/build.sh" "$WORK/targets.json" "$WORK/resolved.json" "$MODE" "$IMPORT" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$WORK" > "$WORK/build.json"

      - name: Test each image on its pushed digest
        id: test
        if: steps.mode.outputs.mode == 'push'
        working-directory: src
        env:
          BUILD_SECRET: ${{ secrets.build-secret }}
          BUILD_SECRET_ENV: ${{ inputs.build-secret-env }}
        run: |
          while IFS=$'\t' read -r target test replaces candidate; do
            digest=$(jq -r --arg t "$target" '.targets[$t].digest' "$WORK/build.json")
            "$PIPELINE/test.sh" "$WORK/resolved.json" "$test" "$replaces" "$candidate@$digest" "$WORK"
          done < <(jq -r '.[] | [.target, .test, .replaces, .candidate] | @tsv' "$WORK/targets.json")
          echo "build=$(jq -c . "$WORK/build.json")" >> "$GITHUB_OUTPUT"

      # Each image's own HEALTHCHECK, under compose, in a container with no mounts and
      # no network: on a pull request the image this job built, on a push the tested
      # candidate. A failure fails the job, so nothing is released.
      - name: Run each image's health check
        id: health
        working-directory: src
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          BUILD_SECRET: ${{ secrets.build-secret }}
          BUILD_SECRET_ENV: ${{ inputs.build-secret-env }}
        run: |
          if [ "$MODE" = push ]; then
            "$PIPELINE/health.sh" "$WORK/targets.json" "$WORK/resolved.json" push "$WORK" "$WORK/build.json"
          else
            "$PIPELINE/health.sh" "$WORK/targets.json" "$WORK/resolved.json" pr "$WORK"
          fi

  release:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.runner }}
    cache-mode: none
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      digests: ${{ steps.release.outputs.digests }}
    steps:
      - name: Require a GitHub-hosted runner and this workflow's own commit
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "::error::The image pipeline runs only on GitHub-hosted runners."; exit 1; }
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::job.workflow_sha is '$WORKFLOW_SHA'; the pipeline scripts are checked out at it."; exit 1; }
          echo "PIPELINE=$GITHUB_WORKSPACE/pipeline/image-pipeline" >> "$GITHUB_ENV"
          echo "WORK=$RUNNER_TEMP/image-pipeline" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/image-pipeline"

      - name: Check out the pipeline scripts at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: coursekata/ck-tf-modules
          ref: ${{ job.workflow_sha }}
          path: pipeline
          sparse-checkout: image-pipeline
          persist-credentials: false

      - name: Read the tool pins
        id: pins
        run: |
          . "$PIPELINE/pins.sh"
          echo "buildx=$BUILDX_VERSION" >> "$GITHUB_OUTPUT"

      # The release copies with buildx imagetools, which needs no builder, so the
      # docker driver installs the pinned buildx and starts no BuildKit.
      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ steps.pins.outputs.buildx }}
          driver: docker
          cache-binary: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.release-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Log in to the registries
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          "$PIPELINE/targets.sh" "$TARGETS" > "$WORK/targets.json"
          "$PIPELINE/registry-login.sh" "$WORK/targets.json"

      - name: Release each target
        id: release
        env:
          BUILD: ${{ needs.build.outputs.build }}
        run: |
          printf '%s\n' "$BUILD" > "$WORK/build.json"
          digests='{}'
          {
            echo '### Image release'
            echo
            echo '| Target | Digest | Copied | Note |'
            echo '|---|---|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"
          while read -r t; do
            out=$("$PIPELINE/release-target.sh" "$WORK/targets.json" "$WORK/build.json" "$t" "$GITHUB_SHA" "$GITHUB_RUN_ID")
            digests=$(jq -c --arg t "$t" --arg d "$(jq -r .digest <<<"$out")" '.[$t] = $d' <<<"$digests")
            jq -r '"| \(.target) | `\(.digest)` | \(.copied | join(", ")) | \(.note) |"' <<<"$out" >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -r '.[].target' "$WORK/targets.json")
          echo "digests=$digests" >> "$GITHUB_OUTPUT"
