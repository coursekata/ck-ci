# Action SHAs only. Renovate leaves every action reference to Dependabot.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/image/build-action", "/image/health-action", "/image/push-action", "/image/release-action"]
    schedule:
      interval: weekly
    # The org's seven-day soak, which Renovate applies to everything else.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
