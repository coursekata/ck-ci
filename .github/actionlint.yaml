# actionlint v1.7.12 does not yet know the job.workflow_* properties GitHub documents, which a
# reusable workflow uses to read files from its own repository at its own commit. Drop the ignore
# once actionlint knows them.
paths:
  .github/workflows/tf-quality.yml:
    ignore:
      - 'property "workflow_(repository|sha)" is not defined in object type'
