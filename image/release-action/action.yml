name: release-action
description: Releases the head of the branch. Copies a changed image by digest, unchanged, to a release repository under the given tags, makes it the latest release and `latest`, and moves the cache repository's current tag to its build cache. An image that matches the latest release apart from build metadata is released nowhere and tagged nowhere, and a run whose commit is no longer the head of its branch writes nothing.

# One image per call, with the caller logged in to write the release and cache repositories. The
# action reads and writes the registry with crane, through that login, and reads the branch
# through the job's token, which needs only read access to the repository. crane copies and tags
# manifests by digest, so the release holds the exact bytes the build pushed.

inputs:
  candidate-repository:
    description: Repository holding the image and build cache to release.
    required: true
  release-repository:
    description: Repository the image is released to.
    required: true
  cache-repository:
    description: Repository whose `current` tag is moved to cache-digest. Leave empty, with cache-digest, to leave the cache alone.
    default: ""
  digest:
    description: Digest of the image to release, in candidate-repository.
    required: true
  tags:
    description: Tag names to release the image under, one per line. Must include sha-<commit>, which marks the commit as released, and run-<run id>, which orders the release, and must not include latest, which the action moves itself. An unchanged image gets none of them.
    required: true
  cache-digest:
    description: Digest of the build cache in candidate-repository, to make current in cache-repository.
    default: ""
  always-update-cache:
    description: Move the cache even when this build is not the release, because an earlier release of the commit stands or the image is unchanged. Set true when the image was built without the cache.
    default: "false"
  baseline-digest:
    description: Ignored. The action finds the latest release itself.
    deprecationMessage: release-action ignores baseline-digest since v0.1.4 and finds the latest release itself. Drop the input, and the step that looked the baseline up.
    default: ""

outputs:
  digest:
    description: This commit's release, or the latest release when the image is unchanged from it. Empty when the commit is no longer the head.
    value: ${{ steps.release.outputs.digest }}
  released:
    description: true when this build is this commit's release, copied by this run or by an earlier attempt of it; false when the image was unchanged, an earlier release of the commit stands, or the commit is no longer the head.
    value: ${{ steps.release.outputs.released }}

runs:
  using: composite
  steps:
    - name: Install crane
      shell: bash
      run: '"$GITHUB_ACTION_PATH/../lib/install-crane.sh"'

    - name: Release the head
      id: release
      shell: bash
      env:
        CANDIDATE: ${{ inputs.candidate-repository }}
        RELEASE: ${{ inputs.release-repository }}
        CACHE: ${{ inputs.cache-repository }}
        DIGEST: ${{ inputs.digest }}
        TAGS: ${{ inputs.tags }}
        CACHE_DIGEST: ${{ inputs.cache-digest }}
        ALWAYS_UPDATE_CACHE: ${{ inputs.always-update-cache }}
        TOKEN: ${{ github.token }}
      run: '"$GITHUB_ACTION_PATH/release.sh"'
