# The OpenTofu bar. tf-quality.yml runs this file with prek over every tracked file, with ck-ci at the
# workflow's own commit and gitleaks skipped, since quality.yml scans the full history. A repository
# copies it to run the same checks before a push, and Renovate keeps the revs current. They need tofu,
# tflint, trivy, gitleaks and jq on PATH, and a .tflint.hcl at the repository root.
# tofu test takes tens of seconds in a large repository, so it runs on push, over every commit pushed,
# and every other hook on commit as well. The workflow runs the push stage, so it runs every hook.
default_install_hook_types: [pre-commit, pre-push]
repos:
  # Third-party hooks are pinned by commit, as actions are, since the workflow runs them with its token.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      # Upstream omits pass_filenames on this variant only, so the staged paths would be appended
      # and the first one read as gitleaks' target directory.
      - id: gitleaks-system
        pass_filenames: false

  # Before anything initialises, since the first init runs provider code.
  - repo: https://github.com/coursekata/ck-ci
    rev: v0.1.0
    hooks:
      - id: tofu-ban
        fail_fast: true
      - id: tofu-testing-guard
        fail_fast: true

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: 4c4437d784e93cacb1f05f1d7bc28e4354fafd20 # frozen: v1.109.4
    hooks:
      - id: terraform_fmt
        args:
          - --hook-config=--tf-path=tofu
      - id: terraform_validate
        args:
          - --hook-config=--tf-path=tofu
          - --tf-init-args=-backend=false
      - id: terraform_tflint
        args:
          - --hook-config=--tf-path=tofu
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl

  - repo: local
    hooks:
      # One scan from the root, so trivy reads .trivyignore itself and a repository without one
      # still scans. Only OpenTofu misconfigurations, and none in the modules under .terraform, which
      # their own repositories gate.
      - id: terraform_trivy
        name: trivy config
        language: system
        files: (\.(tf|tofu)(\.json)?|\.tfvars)$
        pass_filenames: false
        entry: trivy config --exit-code 1 --misconfig-scanners terraform --skip-dirs '**/.terraform' .

  - repo: https://github.com/coursekata/ck-ci
    rev: v0.1.0
    hooks:
      - id: tofu-test
        stages: [pre-push]
